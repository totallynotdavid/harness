# Captain gates itself. The project-wide ShellCheck exceptions live in
# .shellcheckrc; the checks below cover shapes ShellCheck cannot diagnose.

[tools]
gh = "2.101.0"
jq = "1.8"
ruff = "0.16.8"
shellcheck = "0.11.0"
shfmt = "3.14.1"

[tasks.lint]
description = "shellcheck every shell script in bin/ and tests/"
run = "shellcheck --rcfile .shellcheckrc -S warning $(grep -LE '^#!.*python' bin/cap bin/cap-* bin/lib.sh bin/lib/*.sh bin/hooks/*.sh tests/run tests/*.sh tests/static/lint-*)"

[tasks.test]
description = "run Captain's behavior tests"
run = "tests/run"

[tasks.check]
description = "run Captain's behavior tests and static checks"
depends = [
  "doctor",
  "test",
  "lint",
  "check:andlist",
  "check:procsub",
  "check:revlist-topo",
  "check:dead-flag",
  "check:task-state",
  "check:comments",
  "check:python-format",
  "check:syntax",
]

[tasks.doctor]
description = "diagnose mise and validate Captain's repository setup"
run = "bin/mise-doctor"

[tasks."check:andlist"]
description = "find a bare `[ cond ] && cmd` whose false status escapes into set -e"
run = "tests/static/lint-andlist"

[tasks."check:procsub"]
description = "find a `while ... done < <(cmd)` whose producer's exit status is never checked"
run = "tests/static/lint-procsub"

[tasks."check:revlist-topo"]
description = "find a `git rev-list --reverse` without --topo-order"
run = "tests/static/lint-revlist-topo"

[tasks."check:dead-flag"]
description = "find a flag parsed into a variable nothing after the parsing loop reads"
run = "tests/static/lint-dead-flag"

[tasks."check:task-state"]
description = "fail if cap-agents or task-status.sh read status.log as the sole evidence a task is running"
run = "tests/static/lint-task-state"

[tasks."check:comments"]
description = "reject incident history in source comments"
run = "tests/static/lint-comments"

[tasks."check:syntax"]
description = "parse every shell and python script without running it"
run = "for f in $(grep -LE '^#!.*python' bin/cap bin/cap-* bin/lib.sh bin/lib/*.sh bin/hooks/*.sh tests/run tests/*.sh tests/static/lint-*); do bash -n \"$f\" || exit 1; done; for f in bin/caplib.py $(grep -lE '^#!.*python' bin/cap-* tests/*.py); do python3 -c 'import ast,sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])' \"$f\" || exit 1; done"

[tasks."check:python-format"]
description = "verify Python formatting"
run = "ruff format --check bin tests"

[tasks.format]
description = "format Python and shell source"
depends = ["format:python"]
run = "find . -type f -name '*.sh' -exec shfmt -ln bash -i 2 -w {} +"

[tasks."format:python"]
description = "format Python source"
run = "ruff format bin tests"

# No format-check task yet. shfmt would rewrite 1828 lines, because bin/ carries
# two coexisting styles, and a gate that fails on every run teaches people to
# ignore its output. Reformatting is its own task, on a quiet tree.

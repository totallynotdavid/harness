# Captain runs its own gates on itself. Two shell defects surfaced in one day:
# `local a=$1 b=$a`, which fails under set -u because local expands every word
# before it assigns any of them, and a bare `[ cond ] && cmd` in tail position,
# which turns a false test into a failed exit status. shellcheck catches the
# first as SC2318 and has no diagnostic at all for the second, so check:andlist
# exists to cover it.

[tools]
shellcheck = "0.11.0"
shfmt = "3.14.1"

[tasks.lint]
description = "shellcheck every shell script in bin/"
# cap-history is python. SC1091 is a sourced file shellcheck cannot follow.
run = "shellcheck -S warning -e SC1091 $(grep -LE '^#!.*python' bin/cap bin/cap-* bin/lib.sh bin/lint-* bin/hooks/*.sh)"

[tasks."check:andlist"]
description = "find a bare `[ cond ] && cmd` whose false status escapes into set -e"
run = "bin/lint-andlist"

[tasks."check:syntax"]
description = "parse every shell script without running it"
run = "for f in $(grep -LE '^#!.*python' bin/cap bin/cap-* bin/lib.sh bin/lint-* bin/hooks/*.sh); do bash -n \"$f\" || exit 1; done"

# No format-check task yet. shfmt would rewrite 1828 lines, because bin/ carries
# two coexisting styles, and a gate that fails on every run teaches people to
# ignore its output. Reformatting is its own task, on a quiet tree.

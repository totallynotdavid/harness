# Captain gates itself. shellcheck already catches SC2318 (local var
# expansion order); the check: tasks below cover shapes it has no
# diagnostic for.

[tools]
shellcheck = "0.11.0"
shfmt = "3.14.1"

[tasks.lint]
description = "shellcheck every shell script in bin/"
# cap-history is python. SC1091 is a sourced file shellcheck cannot follow.
run = "shellcheck -S warning -e SC1091 $(grep -LE '^#!.*python' bin/cap bin/cap-* bin/lib.sh bin/lint-* bin/hooks/*.sh)"

[tasks."check:andlist"]
description = "find a bare `[ cond ] && cmd` whose false status escapes into set -e"
run = "bin/lint-andlist"

[tasks."check:verdict"]
description = "assert gate_verdict reads the verdict a report states, across known report shapes"
run = "bin/lint-gate-verdict"

[tasks."check:usage-shape"]
description = "assert usage_write and bin/cap-statusline agree on the state/usage record shape and rounding"
run = "bin/lint-usage-shape"

[tasks."check:procsub"]
description = "find a `while ... done < <(cmd)` whose producer's exit status is never checked"
run = "bin/lint-procsub"

[tasks."check:revlist-topo"]
description = "find a `git rev-list --reverse` without --topo-order"
run = "bin/lint-revlist-topo"

[tasks."check:dead-flag"]
description = "find a flag parsed into a variable nothing after the parsing loop reads"
run = "bin/lint-dead-flag"

[tasks."check:task-state"]
description = "fail if cap-crew or crew-status.sh read status.log as the sole evidence a task is running"
run = "bin/lint-task-state"

[tasks."check:syntax"]
description = "parse every shell script without running it"
run = "for f in $(grep -LE '^#!.*python' bin/cap bin/cap-* bin/lib.sh bin/lint-* bin/hooks/*.sh); do bash -n \"$f\" || exit 1; done"

# No format-check task yet. shfmt would rewrite 1828 lines, because bin/ carries
# two coexisting styles, and a gate that fails on every run teaches people to
# ignore its output. Reformatting is its own task, on a quiet tree.

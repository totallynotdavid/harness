# Captain gates itself. shellcheck already catches SC2318 (local var
# expansion order); the check: tasks below cover shapes it has no
# diagnostic for.

[tools]
gh = "2.100.0"
jq = "1.8"
shellcheck = "0.11.0"
shfmt = "3.14.1"

[tasks.lint]
description = "shellcheck every shell script in bin/"
# cap-history is python. SC1091 is a sourced file shellcheck cannot follow.
run = "shellcheck -S warning -e SC1091 $(grep -LE '^#!.*python' bin/cap bin/cap-* bin/lib.sh bin/lint-* bin/hooks/*.sh)"

[tasks.check]
description = "run Captain's lint and check tasks"
depends = [
  "lint",
  "check:andlist",
  "check:findings",
  "check:usage-shape",
  "check:procsub",
  "check:revlist-topo",
  "check:dead-flag",
  "check:task-state",
  "check:gate-since",
  "check:turn",
  "check:commits",
  "check:papercuts",
  "check:syntax",
]

[tasks."check:andlist"]
description = "find a bare `[ cond ] && cmd` whose false status escapes into set -e"
run = "bin/lint-andlist"

[tasks."check:findings"]
description = "assert cap gate accepts a review only when its findings cover the diff, and computes the verdict from them"
run = "bin/lint-findings"

[tasks."check:usage-shape"]
description = "assert bin/cap-statusline's own usage output matches its shape and rounding"
run = "bin/lint-usage-shape"

[tasks."check:procsub"]
description = "find a `while ... done < <(cmd)` whose producer's exit status is never checked"
run = "bin/lint-procsub"

[tasks."check:revlist-topo"]
description = "find a `git rev-list --reverse` without --topo-order"
run = "bin/lint-revlist-topo"

[tasks."check:dead-flag"]
description = "find a flag parsed into a variable nothing after the parsing loop reads"
run = "bin/lint-dead-flag"

[tasks."check:task-state"]
description = "fail if cap-crew or crew-status.sh read status.log as the sole evidence a task is running"
run = "bin/lint-task-state"

[tasks."check:gate-since"]
description = "assert where a plain cap gate round reviews from after each kind of earlier PASS"
run = "bin/lint-gate-since"

[tasks."check:turn"]
description = "assert a dispatcher reads answers, tool-call endings, harness failures and token counts from turn payloads"
run = "bin/lint-turn"

[tasks."check:commits"]
description = "assert cap commit and cap land share commit message rules"
run = "bin/lint-commits"

[tasks."check:papercuts"]
description = "fail when paper-cuts.md is not the rendering of paper-cuts.jsonl, or an entry's subject is not part of Captain"
run = "bin/lint-papercuts"

[tasks."check:syntax"]
description = "parse every shell and python script without running it"
run = "for f in $(grep -LE '^#!.*python' bin/cap bin/cap-* bin/lib.sh bin/lint-* bin/hooks/*.sh); do bash -n \"$f\" || exit 1; done; for f in bin/caplib.py $(grep -lE '^#!.*python' bin/cap-* bin/lint-*); do python3 -c 'import ast,sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])' \"$f\" || exit 1; done"

[tasks.format]
run = "find . -type f -name '*.sh' -exec shfmt -ln bash -i 2 -w {} +"

# No format-check task yet. shfmt would rewrite 1828 lines, because bin/ carries
# two coexisting styles, and a gate that fails on every run teaches people to
# ignore its output. Reformatting is its own task, on a quiet tree.

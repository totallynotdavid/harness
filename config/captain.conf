# Captain configuration. Values can be overridden with environment variables.

# Repos scanned by cap map.
: "${CAP_ROOTS:=$HOME/git:$HOME/git/cicat}"

# Where task worktrees are stored.
# Keep this outside the Captain repo so agents do not inherit its CLAUDE.md.
: "${CAP_WORK_ROOT:=$HOME/.cap-work}"

# Where package-manager caches are shared across worktrees, so a fresh spawn
# is not stuck with a cold install.
: "${CAP_CACHE_ROOT:=$HOME/.cache/cap}"

# The harness agents run under.
: "${CAP_AGENT_HARNESS:=claude}"         # claude | codex

# Profiles for cap ask.
# Fields: name, harness, model.
# The codex profiles stay listed but no ladder points at them. Reach for one
# only to work around a claude session limit, which codex does not share.
CAP_ASK_PROFILES="
sonnet   claude    sonnet
opus     claude    opus
haiku    claude    haiku
rival    codex     -
luna     codex     gpt-5.6-luna
"

# Relative strength, weakest first. Only used to keep a dispatch at or below
# the model the captain is running (see CAP_CEILING). A profile with no rank
# is never held back.
: "${CAP_PROFILE_RANK:=haiku:1 sonnet:2 opus:3 fable:4}"

# Dispatch ladders. Nothing in Captain names a model directly any more; every
# dispatch names a role, and the role resolves to a profile at the moment it
# runs.
#
# A rung is "<profile>:<max-utilization>" and the ladder is ordered strongest
# first. Captain walks it and takes the first rung whose ceiling is at or above
# the account utilization it can currently measure. So the fleet steps down on
# its own as the window fills and steps back up when the window resets, and it
# does that without Captain knowing which plan the account is on: the numbers
# come from the rate-limit windows the harness already reports to the status
# line (see bin/cap-statusline).
#
# The strong rungs are deliberately conservative. A crew agent runs for hours,
# so starting one at 80% of a five-hour window buys a session that dies
# mid-task; a gate is one short review and can afford to run later into it.
: "${CAP_LADDER_CREW:=opus:35 sonnet:80 haiku:96}"
: "${CAP_LADDER_SCOUT:=sonnet:75 haiku:96}"
: "${CAP_LADDER_GATE_A:=opus:45 sonnet:85}"
: "${CAP_LADDER_GATE_B:=sonnet:80 haiku:96}"
: "${CAP_LADDER_CHORE:=haiku:96}"

# The strongest profile Captain may dispatch.
#   auto     no stronger than the model the captain's own session is running
#   <name>   pin to a profile
#   none     no ceiling
# "auto" exists because the model the user chose for their own session is the
# one piece of evidence Captain has about what this account can actually
# afford, and it is evidence the user supplied on purpose. An account with no
# Opus access is run by someone who did not start Opus.
: "${CAP_CEILING:=auto}"

# How long a quota reading stays trustworthy. Past this Captain treats the
# account as unmeasured, which means "no reason to hold back", never "full".
: "${CAP_USAGE_TTL:=900}"

# How long a profile stays out of the ladder after the harness rejects it for
# a session limit, when the rejection carries no reset time of its own.
: "${CAP_BLOCK_SECS:=3600}"

# Agent permissions.
: "${CAP_AGENT_FLAGS:=--permission-mode bypassPermissions}"

# Seconds without output before an agent is idle.
: "${CAP_IDLE_SECS:=45}"

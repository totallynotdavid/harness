# Captain configuration. Values can be overridden with environment variables.

# Repos scanned by cap map.
: "${CAP_ROOTS:=$HOME/git:$HOME/git/cicat}"

# Where task worktrees are stored.
# Keep this outside the Captain repo so agents do not inherit its CLAUDE.md.
: "${CAP_WORK_ROOT:=$HOME/.cap-work}"

# Where package-manager caches are shared across worktrees, so a fresh spawn
# is not stuck with a cold install.
: "${CAP_CACHE_ROOT:=$HOME/.cache/cap}"

# The harness agents run under.
: "${CAP_AGENT_HARNESS:=claude}"         # claude | codex

# Profiles for cap ask.
# Fields: name, harness, model, default effort ("-" for the harness default).
#
# Do not guess at this table. Run cap models: it asks each harness what the
# account can actually reach, checks every profile below against the answer,
# and lists the models no profile has claimed yet. A codex profile naming a
# model or an effort the account does not have is refused before the session
# starts.
# The last column of each row is what the captain asks for by name. The first
# group is dispatched automatically. The second is registered so that asking is
# one word, and belongs to no tier on purpose (see the ceiling below).
: "${CAP_ASK_PROFILES:=
opus     claude    opus            -
sonnet   claude    sonnet          -
haiku    claude    haiku           -
terra    codex     gpt-5.6-terra   xhigh
luna     codex     gpt-5.6-luna    xhigh
rival    codex     -               -
fable    claude    fable           -
astra    codex     gpt-6-astra     xhigh
sol      codex     gpt-5.6-sol     xhigh
}"

# Capability tiers. A tier lists profiles that are interchangeable for the kind
# of thinking it names, drawn from different accounts on purpose. Order matters:
# the first peer with room takes the work.
#
# heavy     judgment that has to be right the first time
# standard  follows a brief, writes code
# cheap     breadth: reading widely, searching, gathering, reviewing a diff,
#           and narrow well-specified work such as commits and comment cleanup
#
# The ceiling is opus on claude and terra on codex, and it is deliberate. The
# account can reach further (cap models lists fable, astra and sol above them),
# but a model that is stronger than the work needs is not free: it is slower,
# it costs more of a window every other role shares, and Captain would be
# spending it on the captain's behalf without being asked. Above the ceiling is
# the captain's call, one word at the call site: cap ask astra, cap spawn -m
# fable, cap gate ... after editing a tier for that one round.
#
# What this costs: with claude full, cheap-tier roles fall through to luna,
# and cap gate says so rather than pretending two reviews happened. Waiting
# for the window is the cheaper answer, and it is the captain's to make
# either way.
#
# astra, sol and terra accept an "ultra" effort above xhigh which delegates to
# sub-agents of its own. Captain already owns that decision, so profiles stop
# at xhigh.
: "${CAP_TIER_HEAVY:=opus terra}"
: "${CAP_TIER_STANDARD:=sonnet terra}"
: "${CAP_TIER_CHEAP:=haiku luna}"

# What each role needs. A role does not leave its tier. A smaller model is not
# a cheaper version of the same agent, it is a different agent that makes
# different decisions, and a decision made badly is paid for twice: once for the
# session that made it, again for the rounds that find and undo it.
#
# scout is standard, not cheap, even though scouting is exploration. What a
# Captain scout returns is a judgment the captain plans from: notes/classroom/
# rebuild-scope.md sized a rebuild, moved where the risk sits, and turned up a
# delete guarded by a read capability. Breadth that returns findings rather
# than judgments is what cheap is for, and cap spawn --light asks for it.
#
# Both gates are cheap. A gate round can be dispatched again for a few cents
# and a few minutes, so review buys correctness through repetition, not
# through a single expensive pass getting it right the first time. A task
# whose implementation genuinely needs heavy-tier judgment gets it through
# cap spawn --heavy, not by spending heavy tier on the review loop around it.
: "${CAP_ROLE_TASK:=standard}"
: "${CAP_ROLE_SCOUT:=standard}"
: "${CAP_ROLE_GATE_A:=cheap}"
: "${CAP_ROLE_GATE_B:=cheap}"
: "${CAP_ROLE_CHORE:=cheap}"

# How hard each role thinks, for a profile that names no effort of its own
# (every claude profile above). A profile that does name one keeps it. Unset
# a role here and it runs at whatever the harness defaults to, which is the
# decision this table exists to make explicitly.
#
# task and scout produce the judgment everything downstream builds on. The
# gates buy correctness through repetition, so a round runs at medium and
# costs less of the window each time. chore writes commit messages and
# trims comments.
#
# haiku takes no effort setting: its sessions report none whatever is passed.
: "${CAP_EFFORT_TASK:=high}"
: "${CAP_EFFORT_SCOUT:=high}"
: "${CAP_EFFORT_GATE_A:=medium}"
: "${CAP_EFFORT_GATE_B:=medium}"
: "${CAP_EFFORT_CHORE:=low}"

# Quota decides whether work starts and which account runs it. It never decides
# how capable the agent is.
#
# Refuse to start work of this tier when the account it would run on is already
# this full. A task agent runs for hours, so one started at 95% dies mid-task
# and costs the whole session plus the rerun; one short cheap call can safely
# use what is left. The gap below 100 is also what the captain's own session
# lives on.
: "${CAP_ADMIT_HEAVY:=88}"
: "${CAP_ADMIT_STANDARD:=92}"
: "${CAP_ADMIT_CHEAP:=97}"

# How long a quota reading stays trustworthy. Past this Captain treats the
# account as unmeasured, which means "no reason to hold back", never "full".
: "${CAP_USAGE_TTL:=900}"

# How long a profile stays out of its tier after the harness rejects it for a
# session limit, when the rejection carries no reset time of its own.
: "${CAP_BLOCK_SECS:=3600}"

# Agent permissions.
: "${CAP_AGENT_FLAGS:=--permission-mode bypassPermissions}"

# Seconds without output before an agent is idle.
: "${CAP_IDLE_SECS:=45}"

# Context percentage at or above which cap send compacts a session before it
# sends. A session near its limit is the one that reports done without
# finishing.
: "${CAP_SEND_CTX_MAX:=40}"

# How long cap send waits for that compaction. A full session takes minutes,
# and the pane shows nothing but a progress bar while it runs.
: "${CAP_SEND_COMPACT_SECS:=600}"

# How many other files may mention a changed file's basename before cap check
# stops treating it as a lead. A vendored framework makes common basenames
# match thousands of files, which buries the handful that matter.
: "${CAP_CHECK_SIBLING_MAX:=20}"
